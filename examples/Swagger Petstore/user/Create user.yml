info:
  name: Create user
  type: http
  seq: 8
  tags:
    - user

http:
  method: POST
  url: "{{baseUrl}}/user"
  body:
    type: json
    data: |-
      {
        "id": 0,
        "username": "",
        "firstName": "",
        "lastName": "",
        "email": "",
        "password": "",
        "phone": "",
        "userStatus": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This can only be done by the logged in user.
