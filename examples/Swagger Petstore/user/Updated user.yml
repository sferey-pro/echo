info:
  name: Updated user
  type: http
  seq: 3
  tags:
    - user

http:
  method: PUT
  url: "{{baseUrl}}/user/:username"
  params:
    - name: username
      value: ""
      type: path
      description: name that need to be updated
  body:
    type: json
    data: |-
      {
        "id": 0,
        "username": "",
        "firstName": "",
        "lastName": "",
        "email": "",
        "password": "",
        "phone": "",
        "userStatus": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
