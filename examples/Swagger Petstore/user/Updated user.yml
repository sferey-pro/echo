          value: ""
          type: path
          description: name that need to be updated
      body:
        type: json
        data: |-
          {
            "id": 0,
            "username": "",
            "firstName": "",
            "lastName": "",
            "email": "",
            "password": "",
            "phone": "",
            "userStatus": 0
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 404 Response
    description: User not found
    request:
      url: "{{baseUrl}}/user/:username"
      method: PUT
      params:
        - name: username
          value: ""
          type: path
          description: name that need to be updated
      body:
        type: json
        data: |-
          {
            "id": 0,
