info:
  name: Creates list of users with given input array (POST)
  type: http
  seq: 7
  tags:
    - user

http:
  method: POST
  url: "{{baseUrl}}/user/createWithArray"
  body:
    type: json
    data: |-
      [
        {
          "id": 0,
          "username": "",
          "firstName": "",
          "lastName": "",
          "email": "",
          "password": "",
          "phone": "",
          "userStatus": 0
        }
      ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
