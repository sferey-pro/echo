info:
  name: Place an order for a pet
  type: http
  seq: 2
  tags:
    - store

http:
  method: POST
  url: "{{baseUrl}}/store/order"
  body:
    type: json
    data: |-
      {
        "id": 0,
        "petId": 0,
        "quantity": 0,
        "shipDate": "",
        "status": "placed",
        "complete": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: successful operation
    request:
      url: "{{baseUrl}}/store/order"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": 0,
            "petId": 0,
            "quantity": 0,
            "shipDate": "",
            "status": "placed",
            "complete": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 0,
            "petId": 0,
            "quantity": 0,
            "shipDate": "",
            "status": "placed",
            "complete": false
          }
  - name: 400 Response
    description: Invalid Order
    request:
      url: "{{baseUrl}}/store/order"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": 0,
            "petId": 0,
            "quantity": 0,
            "shipDate": "",
            "status": "placed",
            "complete": false
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
