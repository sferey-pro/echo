info:
  name: Update an existing pet
  type: http
  seq: 3
  tags:
    - pet

http:
  method: PUT
  url: "{{baseUrl}}/pet"
  body:
    type: json
    data: |-
      {
        "id": 0,
        "category": {
          "id": 0,
          "name": ""
        },
        "name": "doggie",
        "photoUrls": [],
        "tags": [
          {
            "id": 0,
            "name": ""
          }
        ],
        "status": "available"
      }
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://petstore.swagger.io/oauth/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: write:pets read:pets
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 400 Response
    description: Invalid ID supplied
    request:
      url: "{{baseUrl}}/pet"
      method: PUT
      body:
        type: json
        data: |-
          {
            "id": 0,
            "category": {
              "id": 0,
              "name": ""
            },
            "name": "doggie",
            "photoUrls": [],
            "tags": [
              {
                "id": 0,
                "name": ""
              }
            ],
            "status": "available"
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Pet not found
    request:
      url: "{{baseUrl}}/pet"
      method: PUT
      body:
        type: json
        data: |-
          {
            "id": 0,
            "category": {
              "id": 0,
              "name": ""
            },
            "name": "doggie",
            "photoUrls": [],
            "tags": [
              {
                "id": 0,
                "name": ""
              }
            ],
            "status": "available"
          }
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
  - name: 405 Response
    description: Validation exception
    request:
      url: "{{baseUrl}}/pet"
      method: PUT
      body:
        type: json
        data: |-
          {
            "id": 0,
            "category": {
              "id": 0,
              "name": ""
            },
            "name": "doggie",
            "photoUrls": [],
            "tags": [
              {
                "id": 0,
                "name": ""
              }
            ],
            "status": "available"
          }
    response:
      status: 405
      statusText: Method Not Allowed
      body:
        type: text
        data: ""
