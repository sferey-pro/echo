info:
  name: uploads an image
  type: http
  seq: 1
  tags:
    - pet

http:
  method: POST
  url: "{{baseUrl}}/pet/:petId/uploadImage"
  params:
    - name: petId
      value: ""
      type: path
      description: ID of pet to update
  body:
    type: multipart-form
    data:
      - name: additionalMetadata
        type: text
        value: ""
        description: Additional data to pass to server
      - name: file
        type: file
        value: []
        description: file to upload
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://petstore.swagger.io/oauth/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: write:pets read:pets
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: successful operation
    request:
      url: "{{baseUrl}}/pet/:petId/uploadImage"
      method: POST
      params:
        - name: petId
          value: ""
          type: path
          description: ID of pet to update
      body:
        type: multipart-form
        data:
          - name: additionalMetadata
            type: text
            value: ""
            description: Additional data to pass to server
          - name: file
            type: file
            value: []
            description: file to upload
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": 0,
            "type": "",
            "message": ""
          }
